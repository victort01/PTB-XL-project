[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tcc-ecg-ptbxl"
version = "0.1.0"
description = "Projeto notebook-first para classificacao multiclasse de ECGs de 12 derivacoes usando PTB-XL."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "TCC PTB-XL" }]
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "pyyaml>=6.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "imbalanced-learn>=0.11",
    "wfdb>=4.1",
    "matplotlib>=3.7",
    "seaborn>=0.12",
    "joblib>=1.3",
    "pyarrow>=13.0",
    "lightgbm>=4.0",
    "catboost>=1.2",
    "shap>=0.44",
    "lime>=0.2",
    "jupyter>=1.0",
    "ipykernel>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "nbformat>=5.9",
    "ruff>=0.4",
]
dl = [
    "torch>=2.0",
    "tensorflow>=2.15",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
